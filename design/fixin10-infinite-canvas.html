<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixIn10 - Infinite Canvas</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110; --bg-subtle: #191918; --surface: #1e1e1d; --surface-raised: #252524;
    --border: rgba(255,255,255,0.06); --border-hover: rgba(255,255,255,0.12);
    --accent: #c89b6c; --text: #e8e6e3; --text-secondary: rgba(232,230,227,0.6); --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
    --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", "Cascadia Code", monospace;
    --note-bg: #2a2520; --note-border: rgba(200,155,108,0.2);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font-sans); color: var(--text); user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }

  body::after { content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 512px 512px; mix-blend-mode: overlay; }

  .canvas-viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; --grid-color: rgba(255,255,255,0.04); }
  .canvas-viewport.panning { cursor: grabbing; }
  .canvas-world { position: absolute; left: 0; top: 0; width: 20000px; height: 20000px; transform-origin: 0 0; will-change: transform; }
  .canvas-el { position: absolute; cursor: grab; transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging { cursor: grabbing; z-index: 999; box-shadow: var(--shadow-drag) !important; transform: scale(1.01); transition: none; }

  .section-header { position: absolute; pointer-events: none; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .section-header .section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); opacity: 0.8; }
  .section-header .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); }
  .section-header .section-line { flex: none; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.3; }

  .canvas-title { position: absolute; pointer-events: none; font-weight: 700; line-height: 1.1; letter-spacing: -0.025em; color: var(--text); }
  .canvas-text { position: absolute; line-height: 1.7; letter-spacing: 0.005em; color: var(--text-secondary); min-width: 200px; max-width: 560px; white-space: pre-wrap; word-break: break-word; }

  .canvas-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(8px); white-space: nowrap; }
  .canvas-tag .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .context-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-width: 220px; }
  .context-card .card-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px; }
  .context-card .card-head .head-indicator { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .context-card .card-head h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
  .context-card .card-content { padding: 0 20px 20px; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }

  .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .ds-card .ds-head { padding: 16px 20px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }
  .ds-card .ds-body { padding: 0 20px 20px; }

  .color-swatch-group { display: flex; flex-direction: row; flex-wrap: nowrap; gap: 20px; }
  .swatch-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .swatch-circle { width: 56px; height: 56px; border-radius: 50%; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08); }
  .swatch-name { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-align: center; }
  .swatch-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }

  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 16px 18px; min-width: 200px; max-width: 320px; box-shadow: var(--shadow-sm); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); opacity: 0.7; margin-bottom: 8px; }
  .canvas-note .note-body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }

  .design-page { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11px; font-weight: 500; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.6; }

  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }
  .flow-chip { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--surface-raised); border: 1px solid var(--border); font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
  .flow-arr { color: var(--accent); font-size: 14px; opacity: 0.8; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(17,17,16,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); backdrop-filter: blur(12px); }
  .kbd-hint { position: fixed; top: 20px; right: 24px; z-index: 100; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd { font-family: var(--font-mono); padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }

  /* ═══════════════ SCREEN KIT (390x844, direction: Neighbour) ═══════════════ */
  .scr { position: relative; display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--s-bg); color: var(--s-ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden; }
  .scr-a { --s-bg:#F7F6F0; --s-surface:#FFFFFF; --s-ink:#1F1B16; --s-muted:#6E675C; --s-border:#E7E2D6; --s-accent:#146B52; --s-accent-ink:#FFFFFF; --s-accent-soft:#E1EFE8; --s-accent-deep:#0F5741; --s-r-card:16px; --s-r-btn:14px; --s-r-chip:999px; --s-card-border:1px solid var(--s-border); --s-card-shadow:none; --s-serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }

  .s-status { flex: 0 0 50px; padding: 12px 24px 0; display: flex; align-items: flex-start; justify-content: space-between; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--s-ink); }
  .s-status svg { width: 16px; height: 10px; fill: var(--s-ink); }
  .s-status .bat { width: 24px; }
  .s-status.on-accent { color: #fff; }
  .s-status.on-accent svg { fill: #fff; }
  .s-ind { flex: 0 0 22px; position: relative; }
  .s-ind::after { content: ''; position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%); width: 120px; height: 4px; border-radius: 999px; background: var(--s-ink); opacity: 0.85; }
  .s-ind.light::after { background: #fff; }
  .s-cont { flex: 1 1 auto; overflow: hidden; padding: 2px 0 10px; }

  .s-hd { padding: 6px 20px 0; }
  .s-hdtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
  .s-loc { display: inline-flex; align-items: center; gap: 5px; color: var(--s-muted); font-size: 12.5px; font-weight: 500; }
  .s-loc svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .s-icb { width: 36px; height: 36px; border-radius: 999px; background: var(--s-surface); border: var(--s-card-border); box-shadow: var(--s-card-shadow); display: grid; place-items: center; color: var(--s-ink); }
  .s-icb svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .s-hello { margin: 0 0 3px; font-size: 12.5px; color: var(--s-muted); }
  .s-h1 { margin: 0 0 6px; font-family: var(--s-serif); font-size: 25px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; color: var(--s-ink); }
  .s-sub { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--s-muted); max-width: 36ch; }
  .s-label2 { display: block; font-size: 12px; font-weight: 600; color: var(--s-muted); margin: 20px 0 8px; letter-spacing: 0.02em; }

  .s-sect { padding: 16px 20px 0; }
  .s-caps { display: block; margin: 0 0 8px; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--s-muted); }

  .s-svc { position: relative; display: grid; grid-template-columns: 42px 1fr; gap: 11px; align-items: center; background: var(--s-surface); border: var(--s-card-border); box-shadow: var(--s-card-shadow); border-radius: var(--s-r-card); padding: 12px 36px 12px 12px; margin-bottom: 9px; }
  .s-svc-ic { width: 42px; height: 42px; border-radius: 13px; background: var(--s-accent-soft); color: var(--s-accent-deep); display: grid; place-items: center; }
  .s-svc-ic svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .s-nm { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--s-ink); }
  .s-ds { display: block; font-size: 12.5px; color: var(--s-muted); margin-top: 1px; }
  .s-pr { display: block; margin-top: 3px; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; font-size: 11.5px; color: var(--s-muted); font-variant-numeric: tabular-nums; }
  .s-ck { position: absolute; top: 11px; right: 11px; width: 19px; height: 19px; border-radius: 50%; background: var(--s-accent); color: var(--s-accent-ink); display: none; place-items: center; }
  .s-ck svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.4; }
  .s-sel { border-color: var(--s-accent) !important; box-shadow: 0 0 0 1px var(--s-accent), var(--s-card-shadow) !important; }
  .s-sel .s-ck { display: grid; }
  .s-tagI { position: absolute; top: 11px; right: 11px; font-size: 10px; font-weight: 600; color: var(--s-accent-deep); background: var(--s-accent-soft); border-radius: 999px; padding: 3px 8px; }

  .s-btn { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--s-accent); color: var(--s-accent-ink); border-radius: var(--s-r-btn); font-size: 15px; font-weight: 600; letter-spacing: 0.005em; }
  .s-btn.ghost { background: transparent; color: var(--s-ink); border: 1px solid var(--s-border); }
  .s-btn.tint { background: var(--s-accent-soft); color: var(--s-accent-deep); }

  .s-pro { display: grid; grid-template-columns: 40px 1fr auto; gap: 11px; align-items: center; padding: 10px 0; border-top: 1px solid var(--s-border); }
  .s-pro:first-of-type { border-top: 0; }
  .s-avat { width: 40px; height: 40px; border-radius: 50%; background: var(--s-accent-soft); color: var(--s-accent-deep); display: grid; place-items: center; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; flex: none; }
  .s-pnm { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; color: var(--s-ink); }
  .s-pds { font-size: 12px; color: var(--s-muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .s-pds svg { width: 11px; height: 11px; fill: var(--s-accent); flex: none; }
  .s-chip { font-size: 10.5px; font-weight: 600; color: var(--s-accent-deep); background: var(--s-accent-soft); border-radius: var(--s-r-chip); padding: 4px 9px; white-space: nowrap; }

  .s-tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px 0; border-top: 1px solid var(--s-border); background: var(--s-surface); }
  .s-tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 8px; color: var(--s-muted); font-size: 10px; letter-spacing: 0.02em; }
  .s-tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .s-tab.on { color: var(--s-ink); font-weight: 600; }
  .s-tab.on svg { stroke-width: 2; }

  .s-bk-hd { display: flex; align-items: center; gap: 12px; padding: 8px 20px 14px; }
  .s-back { width: 38px; height: 38px; border-radius: 999px; background: var(--s-surface); border: var(--s-card-border); box-shadow: var(--s-card-shadow); display: grid; place-items: center; color: var(--s-ink); flex: none; }
  .s-back svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; }
  .s-bk-h1 { font-family: var(--s-serif); font-size: 21px; letter-spacing: -0.015em; font-weight: 600; margin: 0; color: var(--s-ink); }
  .s-card { background: var(--s-surface); border: var(--s-card-border); box-shadow: var(--s-card-shadow); border-radius: var(--s-r-card); padding: 14px; margin-bottom: 10px; }
  .s-crow { display: flex; align-items: center; gap: 11px; }
  .s-crow .grow { flex: 1; min-width: 0; }
  .s-crow .right { text-align: right; flex: none; }
  .s-hr { height: 1px; background: var(--s-border); margin: 11px 0 5px; }
  .s-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; font-size: 13.5px; color: var(--s-muted); }
  .s-line b { color: var(--s-ink); font-weight: 600; }
  .s-tot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--s-border); margin-top: 6px; padding-top: 10px; }
  .s-tot .k { font-size: 14px; font-weight: 600; color: var(--s-ink); }
  .s-tot .v { font-size: 19px; font-weight: 600; color: var(--s-ink); }
  .s-mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace; font-variant-numeric: tabular-nums; }
  .s-change { font-size: 12px; font-weight: 500; color: var(--s-ink); text-decoration: underline; text-underline-offset: 3px; }
  .s-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; line-height: 1.5; color: var(--s-muted); padding: 2px 2px 0; }
  .s-note svg { width: 14px; height: 14px; flex: none; stroke: var(--s-muted); fill: none; stroke-width: 1.7; margin-top: 1px; }
  .s-mini-ic { width: 34px; height: 34px; border-radius: 11px; background: var(--s-accent-soft); color: var(--s-accent-deep); display: grid; place-items: center; flex: none; }
  .s-mini-ic svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }

  /* splash / onboarding / auth */
  .s-splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px; background: var(--s-accent); color: #fff; text-align: center; padding: 0 30px; }
  .s-splash .mark { width: 64px; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.16); display: grid; place-items: center; margin-bottom: 6px; }
  .s-splash .mark svg { width: 32px; height: 32px; stroke: #fff; fill: none; stroke-width: 1.8; }
  .s-splash .wm { font-family: var(--s-serif); font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
  .s-splash .tg { font-size: 13.5px; opacity: 0.88; line-height: 1.55; }
  .s-splash .bar { width: 120px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.25); margin-top: 26px; overflow: hidden; }
  .s-splash .bar i { display: block; width: 42%; height: 100%; background: #fff; border-radius: 999px; }

  .s-ob { padding: 10px 24px 0; display: flex; flex-direction: column; flex: 1; }
  .s-art { position: relative; height: 272px; border-radius: 20px; background: var(--s-accent-soft); overflow: hidden; }
  .s-art .ring { position: absolute; border: 1.5px dashed color-mix(in oklab, var(--s-accent) 32%, transparent); border-radius: 50%; }
  .s-art .big { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-52%); font-family: var(--s-serif); font-size: 112px; font-weight: 600; color: var(--s-accent-deep); letter-spacing: -0.04em; }
  .s-art .dot { position: absolute; width: 44px; height: 44px; border-radius: 14px; background: var(--s-surface); display: grid; place-items: center; color: var(--s-accent-deep); box-shadow: 0 4px 14px rgba(31,27,22,0.08); }
  .s-art .dot svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }

  .s-auth { padding: 12px 24px 0; }
  .s-field { display: flex; align-items: center; gap: 10px; background: var(--s-surface); border: 1.5px solid var(--s-border); border-radius: 14px; padding: 0 14px; min-height: 54px; }
  .s-field.on { border-color: var(--s-accent); box-shadow: 0 0 0 1px var(--s-accent); }
  .s-field .cc { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 14px; font-weight: 600; color: var(--s-ink); padding-right: 10px; border-right: 1px solid var(--s-border); }
  .s-field .val { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 16px; color: var(--s-ink); letter-spacing: 0.03em; }
  .s-field .hint { font-size: 13.5px; color: var(--s-muted); display: flex; align-items: center; gap: 8px; }
  .s-field .hint svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }

  .s-otp { display: flex; gap: 10px; }
  .s-otp span { width: 54px; height: 62px; border-radius: 12px; border: 1.5px solid var(--s-border); background: var(--s-surface); display: grid; place-items: center; font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 24px; font-weight: 600; color: var(--s-ink); }
  .s-otp span.on { border-color: var(--s-accent); box-shadow: 0 0 0 1px var(--s-accent); }
  .s-otp span.empty::after { content: ''; width: 2px; height: 26px; background: var(--s-accent); border-radius: 2px; }

  /* map */
  .s-map { position: relative; border-radius: 16px; overflow: hidden; background: #E7EAE1; }
  .s-map .rd { position: absolute; background: rgba(255,255,255,0.92); }
  .s-map .rd.h { height: 9px; left: -5%; right: -5%; border-radius: 6px; }
  .s-map .rd.v { width: 9px; top: -5%; bottom: -5%; border-radius: 6px; }
  .s-map .blk { position: absolute; background: rgba(255,255,255,0.42); border-radius: 8px; }
  .s-map .route { position: absolute; inset: 0; width: 100%; height: 100%; }
  .s-map .pin { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--s-accent); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(31,27,22,0.25); }

<script>
(() => {
  const UI_STRINGS = {
    docTitle: 'FixIn10 - Infinite Canvas',
    zoom: { zoomIn: 'Zoom in', zoomOut: 'Zoom out', reset: 'Reset view' },
    kbdHints: [['Scroll', 'pan'], ['Ctrl+Scroll', 'zoom'], ['Ctrl+Z', 'undo']],
    sections: { context: '01 PROJECT CONTEXT', designSystem: '02 DESIGN SYSTEM', deliverables: '03 DESIGN DELIVERABLES' },
  };

  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints.map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`).join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }
  function updateGrid() {
    const g = 40 * zoom;
    viewport.style.backgroundImage = `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
    viewport.style.backgroundSize = `${g}px ${g}px`;
    viewport.style.backgroundPosition = `${panX % g}px ${panY % g}px`;
  }

  let isPanning = false, panSX, panSY;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true; panSX = e.clientX - panX; panSY = e.clientY - panY;
      viewport.classList.add('panning'); viewport.setPointerCapture(e.pointerId); e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => { if (isPanning) { panX = e.clientX - panSX; panY = e.clientY - panSY; updateTransform(); } });
  viewport.addEventListener('pointerup', () => { isPanning = false; viewport.classList.remove('panning'); });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * (e.deltaY > 0 ? 0.95 : 1.05)));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) { panX -= e.deltaX; panY -= e.deltaY; }
      else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * (e.deltaY > 0 ? 0.95 : 1.05)));
        panX = mx - wx * zoom; panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom; panY = cy - wy * zoom; updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;

  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => s.push({ id: el.id, left: el.style.left, top: el.style.top }));
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => { const el = document.getElementById(a.id); if (el) { el.style.left = a.left; el.style.top = a.top; } });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); } });

  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true; el.classList.add('dragging'); saveUndo();
      sx = e.clientX; sy = e.clientY; ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId); e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => { if (dragging) { el.style.left = (ox + (e.clientX - sx) / zoom) + 'px'; el.style.top = (oy + (e.clientY - sy) / zoom) + 'px'; } });
    el.addEventListener('pointerup', () => { if (dragging) { dragging = false; el.classList.remove('dragging'); } });
  }

  let _id = 0;
  function uid(p) { return (p || 'el') + '-' + (++_id); }

  function addSection(rowY, label) {
    const parts = label.split(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px'; el.style.top = rowY + 'px';
    el.innerHTML = `<span class="section-line"></span><span class="section-num">${parts[0] || ''}</span><span class="section-label">${parts.slice(1).join(' ')}</span>`;
    world.appendChild(el);
    return rowY;
  }
  function addTitle(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-title'; el.id = uid('title');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;
  }
  function addText(x, y, text, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el'; el.id = uid('text');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addTag(x, y, label, options = {}) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('tag');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = `<div class="canvas-tag"><span class="tag-dot" style="background:${options.color || 'var(--accent)'}"></span>${label}</div>`;
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('ctx');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = `<div class="context-card" style="width:100%;${h ? 'height:100%' : ''}"><div class="card-head"><div class="head-indicator"></div><h3>${title}</h3></div><div class="card-content">${content}</div></div>`;
    world.appendChild(el); makeDraggable(el);

  }
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');

    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';

  function addPage(x, y, w, h, label, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('page');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = (h + 40) + 'px';

  function addNote(x, y, tag, text) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('note');

    const el = document.createElement('div');

  }

    return '<div class="color-swatch-group" style="gap:12px;flex-wrap:wrap;">' + items.map(s =>

  }

    const tagsY = below(r1Desc, 18);

    const tag4 = addTag(rightOf(tag3, 8), tagsY, 'iOS + Android');
    const tag5 = addTag(rightOf(tag4, 8), tagsY, 'English + Hindi ready');

    const cardsY = below(tag1, 26);
    const c1 = addContextCard(100, cardsY, 330, null, 'The product',
      'Household fixes stall for weeks: no trusted pro, no clear price, no quick slot. FixIn10 matches a verified pro in about ten minutes, tracks the visit live, and bills by the hour actually worked.');
    const c2 = addContextCard(450, cardsY, 300, null, 'Who it is for',
      'Renters and families in metros who want repairs done without haggling. Pros get steady work, clear jobs and same-day payouts.');
    const c3 = addContextCard(770, cardsY, 330, null, 'This round',
      'The complete customer journey: 25 screens from splash to support, plus an interactive prototype that runs the whole cycle end to end. Customer app first; pro side comes next.');

    const flowY = maxY([c1, c2, c3], 30);
    const flow = addDiagram(100, flowY, 1240, 128,
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
        '<span class="flow-chip">Name the problem</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Matched in ~10 min</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Track arrival live</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Start with code</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Work, billed hourly</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Pay & rate</span><span class="flow-arr">→</span>' +
        '<span class="flow-chip">Bookings, wallet, Plus, referrals</span>' +
      '</div>' +
      '<div style="margin-top:12px;font-size:11.5px;color:var(--text-tertiary);">Customer happy path. Chat runs alongside tracking and the job; Support and Settings sit off Profile.</div>');

    const notesY = below(flow, 28);
    const n1 = addNote(100, notesY, 'Name research',
      'FixIn10 chosen after a scan: no direct app-store collisions found, the 10-minute promise is in the name, and it keeps the "10" from the tenmin-service repo. FixKar and FixMitro are already taken in this category; the Tez family is crowded. TenMin and TezFix stay as bench alternates. Do a formal trademark and domain check before launch.');
    const n2 = addNote(rightOf(n1, 20), notesY, 'How to read this',

    /* ── Row 2: DESIGN SYSTEM ── */
    const r2Start = maxY([c1, c2, c3, flow, n1, n2, n3], 84);
    addSection(r2Start, UI_STRINGS.sections.designSystem);

    const r2Head = addText(100, r2Start + 58,

      '--bg #F7F6F0 · --surface #FFFFFF · --ink #1F1B16<br>--muted #6E675C · --border #E7E2D6<br>--accent #146B52 · --accent-soft #E1EFE8<br>--success #16A34A · --danger #DC2626 (runtime only)</div>'
